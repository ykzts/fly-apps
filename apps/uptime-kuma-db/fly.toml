# fly.toml app configuration file generated for ykzts-uptime-db on 2026-05-23T07:54:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ykzts-uptime-db'
primary_region = 'nrt'

[build]
  image = 'mariadb:12.2.2-noble'

[env]
  MYSQL_RANDOM_ROOT_PASSWORD = '1'
  MYSQL_ROOT_HOST = 'localhost'

[[mounts]]
  source = 'mariadb_data'
  destination = '/var/lib/mysql'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[checks]
  [checks.mariadb]
    port = 3306
    type = 'tcp'
    interval = '15s'
    timeout = '5s'
    grace_period = '1m0s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
